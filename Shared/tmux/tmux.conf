# ── unified tmux config (works on Linux/WSL + Windows/psmux) ──────────────

set -g mouse on
set -s escape-time 0
set -ga terminal-overrides ",xterm-256color*:Tc"
set-option -g default-terminal "xterm-256color"

# ── make alt key work ─────────────────────────────────────────────────────────────────
# Enable extended keys support
set -g extended-keys on
set -s extended-keys on
# Use reliable CSI u format (tmux 3.5 or newer)
set -g extended-keys-format csi-u
# Optional: Force terminal feature recognition if auto-detect fails
set -as terminal-features 'xterm*:extkeys'

# ── layout ─────────────────────────────────────────────────────────────────
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on
set-option -g allow-rename off

# ── prefix: C-a (unbind C-b) ──────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── splits ─────────────────────────────────────────────────────────────────
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# ── pane navigation (Alt-hjkl, no prefix) ──────────────────────────────────
# In nvim: Alt-hjkl wird an nvim weitergereicht (siehe keymaps.lua: alt_nav),
# damit nvim zuerst zwischen eigenen Fenstern wechselt und erst am Rand an
# tmux übergibt. Außerhalb von nvim steuert Alt-hjkl direkt die tmux-Panes.
bind -n M-h if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell -F '#{==:#{pane_current_command},nvim}' 'send-keys M-l' 'select-pane -R'

# ── bells / activity ───────────────────────────────────────────────────────
set -g visual-activity off
set -g visual-bell off
setw -g monitor-activity off
set -g bell-action none

# ── catppuccin mocha status bar ────────────────────────────────────────────
set -g status-style bg=default
set -g status-style fg=default
set -g status-left "#[fg=#cba6f7, bold] #S #[fg=default, nobold] | "
set -g status-left-length 250
set -g window-status-format "#I:#W"
set -g window-status-current-format "#[fg=#74c7ec] #I:#W"
set-option -g status-right " | #H"

# ── vi copy mode (the "y to copy" binding is OS-specific: xclip on Linux) ──
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# ── reload config ──────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf

# ── OS-specific overrides (clipboard, default-shell, WORKTREE_ROOT) ────────
# One symlink, two meanings: linkconfig.ps1 → tmux.windows.conf,
# linkconfig.sh → tmux.linux.conf.  No runtime detection needed.
#
# The old Primeagen-sessionizer bindings (f/i/g/M) also live in these two
# files rather than here, even though the commands are identical on both
# OSes: real tmux on Linux supports `bind-key -r` (repeat: tap the key again
# without re-pressing the prefix) but psmux silently drops `-r` bindings
# entirely (they never show up in `list-keys`), so a single shared
# `bind-key -r` line would quietly lose the repeat behavior on Windows AND
# give no indication why. Splitting them per-OS keeps `-r` where it works.
source-file ~/.config/tmux/tmux.os.conf
