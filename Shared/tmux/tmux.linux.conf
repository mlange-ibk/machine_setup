# ── Linux / WSL overrides ──────────────────────────────────────────────────

set-environment -g WORKTREE_ROOT "$HOME/Repository/Worktrees"

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# workmux two-key shortcuts: <prefix>w then p or d.
# tmux has no native multi-key bindings, so `w` switches the client into the
# `wm-choices` key table; the second key acts and the table is restored.
#   wp → launcher (fzf popup: project → worktree/branch → workmux session)
#   wd → workmux-dashboard hub (respawns a dead dashboard, then switches)
bind-key w switch-client -T wm-choices
bind-key -T wm-choices p "display-popup -E -w 90% -h 90% ~/.local/scripts/wmw \; switch-client -T root"
bind-key -T wm-choices d "display-popup -E -w 80% -h 80% -T workmux workmux\ dashboard \; switch-client -T root"

# old Primeagen sessionizer (ad-hoc ~/code directories) — real tmux supports
# `-r` (repeat: tap again within repeat-time without re-pressing the prefix).
bind-key -r f run-shell "bash ~/.local/scripts/tmux-sessionizer"
bind-key -r i run-shell "bash ~/.local/scripts/tmux-cht.sh"
bind-key -r g run-shell "bash ~/.local/scripts/gitmoji_selector.sh"
bind-key -r M run-shell "bash ~/.local/scripts/tmux-sessionizer ~/code/Machine_Setups"
