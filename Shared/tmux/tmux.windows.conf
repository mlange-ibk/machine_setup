# ── Windows / psmux overrides ──────────────────────────────────────────────

# Default shell is PowerShell 7, not Git Bash. This is a deliberate change
# (2026-09-14) from the original bash-default: WSL2/real Linux is now the
# primary coding environment (real tmux, no psmux-specific gotchas at all),
# so psmux is reserved for genuinely Windows-native work — and for that,
# PowerShell's own profile (aliases, functions, PSReadLine predictive
# IntelliSense, `Register-ArgumentCompleter` tab-completion for gh/docker/
# winget/etc.) matters more than bash's POSIX toolbelt. This does NOT cost
# any TUI compatibility: nvim/lazygit/lazysql/opencode all talk to psmux's
# ConPTY directly, so their rendering/mouse/raw-mode/isTTY behavior is
# identical regardless of which shell spawned them — none of that is
# shell-dependent. `bind-key B`/`b` below still open Git Bash on demand for
# anything POSIX-flavored (matches psmux's own documented multi-shell
# pattern), and the worktree picker's 5-window bootstrap picks up whichever
# shell is set here automatically (it only ever passes `-c <dir>`, never a
# shell), so this is a config-only change with no script updates needed.
set-option -g default-shell pwsh
set-option -g default-command pwsh

set-environment -g WORKTREE_ROOT "C:/Entwicklung/Worktrees"

# psmux pre-spawns idle standby shells (the "warm pool", on by default) so
# new-session/new-window/split-window feel instant. Each spare is a real
# process running whatever `default-shell` is set to (bash.exe when this was
# first written, pwsh now — the bug applies equally to either), holding
# whatever directory it was created in as its Windows current-directory — a
# real, open handle. The worktree picker's 5-window bootstrap is exactly the kind
# of rapid-fire new-window burst that makes psmux over-provision this pool
# (its own docs call this "surge"), and those spares are internal server
# bookkeeping, invisible to `list-sessions`/`list-panes`, so `kill-session`
# on the session that used them does not reach them. They keep running,
# still holding the worktree folder open, so `git worktree remove` fails
# with "Permission denied" — indefinitely, since an unclaimed spare "may sit
# around for days" per psmux's own warm-sessions docs. Verified empirically
# (2026-09-14) on psmux 3.3.6: a runtime `set -g warm off`/`on` around the
# bootstrap does NOT prevent this (the pool already exists by the time the
# option is set); only disabling warm at server boot does. `warm-pool-size 0`
# would be the more surgical fix (warm off also kills the `__warm__` standby
# that makes brand-new sessions fast) but is not implemented in 3.3.6 (logs
# "unknown option" and is silently a no-op) — revisit if/when psmux ships it
# (newer than the installed 3.3.6 was available at time of writing).
set-option -g warm off

# worktree picker (<prefix>w → fzf popup: switch / checkout / clone)
# PowerShell-native on Windows: psmux executes display-popup commands through
# pwsh, where a bare `bash C:/...` pre-resolves to WSL's bash.exe and cannot
# read Windows drive paths. `~`/`$HOME` also get pre-mangled by psmux, so use
# a literal forward-slash path (machine-specific, like default-shell above).
bind-key w display-popup -E -w 90% -h 90% "pwsh -NoProfile -File C:/Users/mlange/.local/scripts/worktree/tmux-worktree.ps1"

# old Primeagen sessionizer (ad-hoc ~/code directories) — no `-r` here: psmux
# silently drops `bind-key -r` bindings (they never show up in `list-keys`).
bind-key f run-shell "bash ~/.local/scripts/tmux-sessionizer"
bind-key i run-shell "bash ~/.local/scripts/tmux-cht.sh"
bind-key g run-shell "bash ~/.local/scripts/gitmoji_selector.sh"
bind-key M run-shell "bash ~/.local/scripts/tmux-sessionizer ~/code/Machine_Setups"

# Git Bash on demand, now that it is no longer the default shell (see above).
# Mirrors psmux's own documented multi-shell pattern (docs/multi-shell.md), but
# NOT via that doc's literal `new-window "<path>"` / `split-window "<path>"`
# syntax: verified empirically (2026-09-14, psmux 3.3.6) that a trailing
# shell-command argument on new-window/split-window is unreliable from this
# config — sometimes it creates a real second window/pane, sometimes it
# silently types the command into the CURRENT pane instead (no error either
# way), and `\;` command-chaining on one bind-key line was equally unreliable.
# The combination that verified reliably every time: create a plain
# window/pane (no shell-command argument at all — bare new-window/
# split-window is solid), capture its pane-id with `-P -F`, then a *separate*
# send-keys targeted at that exact pane-id types the bash launch line. `&` is
# PowerShell's call operator, required because a bare quoted path is just a
# string literal to pwsh, not something it executes — and the path needs it
# since default-shell is pwsh now (see above). `##{pane_id}` (doubled `#`) is
# required, not `#{pane_id}`: bind-key commands go through one round of
# tmux's own format-expansion at key-press time before run-shell hands the
# text to pwsh, so the doubled form is what survives that pass and reaches
# the nested `tmux new-window`/`split-window -P -F` call as a literal
# `#{pane_id}` for *it* to expand against the pane it just created.
bind-key B run-shell "$p = (tmux new-window -P -F '##{pane_id}'); tmux send-keys -t $p \"& 'C:/Program Files/Git/bin/bash.exe'\" Enter"
bind-key b run-shell "$p = (tmux split-window -v -P -F '##{pane_id}'); tmux send-keys -t $p \"& 'C:/Program Files/Git/bin/bash.exe'\" Enter"
